name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Cross-compiles for both crates on one host: vxWorks 5.4 ppc604 (DC1,
        # Tornado 2.0) and vxWorks 5.2 mv162 (DC2, ANL's 68k gcc). EL9 only --
        # and el_version defaults to 8, so it must be named explicitly.
        el: ['9']
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/ci.yml@main
    with:
      scripts_dir: gemini-rtsw-ci
      el_version: ${{ matrix.el }}

  # Rebuilds rpm-repo:latest ONCE after all EL legs have pushed their scratch
  # tags. Without this the RPMs never land in the served repo.
  publish:
    needs: build
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main
    secrets: inherit
