# What makes a build THIS build. The single source for these values, read by
#
#   tools/linux-build/setup-dc1.sh   (sourced as shell)
#   ppc/config/CONFIG.Defs           (included as make, via setup-dc1.sh)
#   gnirsdc.spec                     (read with %(...) for %install)
#
# so a local `make` and the pipeline's rpmbuild cannot disagree about any of
# them. Plain KEY=value with no spaces, so that sh and make both parse it.
#
# The GNIRS DC is two crates, one RPM each:
#   gnirsdc-1-vme  DC1 ngnirsdc1  MVME2700  vxWorks 5.4.2  GEM7 tree in ppc/
#   gnirsdc-2-vme  DC2 ngnirsdc2  MVME162   vxWorks 5.2    GEM5 tree at the top

SITE=MK

# The file server the crates boot from. CONFIG_APPLIC splits APPLIC_IOCPATH on
# a colon, hence the separate host.
IOCPATH_HOST=mkotcsbootv2-lv1

# Where each crate's startup script cd's, and where the RPMs install. These are
# production's paths through its DC selector links (DC -> V1-10, DC -> V1-13),
# so the boot parameters' startup-script lines do not change; only the boot
# host does.
DC1_DEPLOY=/gemini/epics3.13.4/gnirs/DC/DC/ppc
DC2_DEPLOY=/gemini/GEM5/gnirs/DC/DC
